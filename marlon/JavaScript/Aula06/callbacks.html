<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callbacks</title>
</head>
<body>
    <script>
        function processar(texto, preProcessamento = (texto) => texto){
            const textoPreProcessado = preProcessameto(texto);
            return textoPreProcessado.toLowerCase();
        }
        return texto.toLowerCase();
    </script>
</body>
</html>
