<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Declaracao Normal de Funcao
        function somar(num1,num2){
            return num1 + num2;
        }

        let soma = somar(2,4);
        console.log(soma);

        // Declaracao Funcao Anonima
        const somar = function (num1, num2) {
            return num1 + num2;
        };
        
        // Declaracao Funcao de Seta (Arrow Functions)
        
        const somar = (num1, num2) => num1 +num2;
    </script>
</body>
</html>
