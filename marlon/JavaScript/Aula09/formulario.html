<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos</title>

    <style>
      #produto-form > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 8px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <h1>Gestão de Produtos</h1>

    <form id="produto-form">
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" />
      </div>

      <div>
        <label for="preco">Preço</label>
        <input type="number" step="0.01" id="preco" name="preco" />
      </div>

      <div>
        <label for="categoria">Categoria</label>
        <select name="categoria" id="categoria">
          <option value="">Sem Categoria</option>
          <option value="Eletronico">Eletrônico</option>
          <option value="Textil">Têxtil</option>
          <option value="Limpeza">Limpeza</option>
        </select>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>

    <script>
      function mostrarMensagem(text, type) {
        const pMensagem = document.getElementById("mensagem");

        pMensagem.innerText = text;
        pMensagem.style.color = type == "sucess" ? "green" : "red";
        pMensagem.style.fontWeight = "bold";
      }

      // Formulario de Produto
      const produtoForm = document.getElementById("produto-form");

      // Atribuindo função "handle" para o atributo "onsubmit"
      //-- produtoForm.onsubmit = () => {}

      // Adicionando um "eventListener" para o evento de "submit"
      produtoForm.addEventListener("submit", (event) => {
        // Evitar o formulario de realizar o Comportamento Padrão
        // ENviar os Dados pelo Action e Recarregar a Página
        event.preventDefault();

        // <form>.<inputId> -> Busca o Input do Formulário
        // <form>.<inputId>.value -> Busca o valor do Input do Formulário
        const produto = {
          nome: produtoForm.nome.value.trim(),
          preco: Number(produtoForm.preco.value),
          categoria: produtoForm.categoria.value,
        };

        // Validar o form

        if (produto.nome === "") {
          mostrarMensagem("O campo nome é obrigatório", "error");
          return;
        }

        if (produto.preco === "") {
          mostrarMensagem("O campo preco é obrigatório", "error");
          return;
        }

        produto.preco = Number(produto.preco);

        if (produto.preco <= 0) {
          mostrarMensagem("O campo preco é obrigatório", "error");
          return;
        }

        console.log(produto);
      });
    </script>
  </body>
</html>
