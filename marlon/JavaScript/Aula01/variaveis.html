<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variaveis</title>
  </head>
  <body>
    <script>
      // var = Escopo global
      var nome = "Marlon";
      console.log(nome);

      // let = Escopo local
      let altura = 1.75;
      console.log(altura);
      
      // const = Escopo local (imutavel)
      const cpf = '000.000.000-11'
      console.log(cpf)

      // let e var muda
      nome = "Gevanildo"
      altura = 1.82

      console.log(nome)
      console.log(altura)
    </script>
  </body>
</html>
