<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let nmr = Number(prompt("Digite um numero: "));

      if (nmr % 2 == 0) {
        alert("O numero é par");
      } else {
        alert("O numero é impar");
      }
    </script>
  </body>
</html>
